modLoader     = "javafml"
loaderVersion = "${loader_version_range}"
license       = "${mod_license}"
#issueTrackerURL="${mod_issues}"
[[mods]]
modId         = "${mod_id}"
version       = "${version}"
displayName   = "${mod_name}"
displayURL    = "https://www.curseforge.com/minecraft/mc-mods/aliens-vs-predator-resurrection-aliens"
logoFile      = "${mod_logo}"
credits       = "${mod_credits}"
authors       = "${mod_author}"
description   = '''${mod_description}'''
[[mixins]]
    config        = "${mod_id}.mixins.json"
[[mixins]]
    config        = "${mod_id}.neoforge.mixins.json"
[[dependencies.${mod_id}]]
    modId         = "neoforge"
    type          = "required"
    versionRange  ="${neo_version_range}"
    ordering      = "NONE"
    side          = "BOTH"
[[dependencies.${mod_id}]]
    modId         = "minecraft"
    type          = "required"
    versionRange  = "${minecraft_version_range}"
    ordering      = "NONE"
    side          = "BOTH"
[[dependencies.${mod_id}]]
    modId         = "blib"
    type          = "required"
    versionRange  = "[${blib_version},)"
    side          = "BOTH"
[[dependencies.${mod_id}]]
    modId         = "blib_engine"
    type          = "optional"
    versionRange  = "[${blib_engine_version},)"
    side          = "BOTH"
[[dependencies.${mod_id}]]
    modId         = "avp_human"
    type          = "optional"
    versionRange  = "[${avp_human_version},)"
    side          = "BOTH"
[[dependencies.${mod_id}]]
    modId         = "avp_predator"
    type          = "optional"
    versionRange  = "[${avp_predator_version},)"
    side          = "BOTH"
[[dependencies.${mod_id}]]
    modId         = "gigeresque"
    type          = "optional"
    versionRange  = "[${gigeresque_version},)"
    side          = "BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
