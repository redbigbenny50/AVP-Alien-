plugins {
    id 'blib-multiloader-root'
}

allprojects {
    repositories {
        mavenLocal()
        maven {
            name = 'Vendored BLib'
            url = uri("${rootProject.projectDir}/vendor/maven")
            content {
                includeGroup 'com.blib'
            }
        }
        maven {
            name = "avpReleases"
            url = uri("https://maven.aliensvspredatormod.com/releases")
        }
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.blib' && details.requested.name.startsWith('blib-')) {
                details.useVersion rootProject.blib_version
                details.because 'Some published AVP/BLib POMs point at missing BLib versions.'
            }
        }
    }

    tasks.withType(org.gradle.api.tasks.AbstractCopyTask).configureEach {
        duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    }

    tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
        duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    }

    tasks.configureEach { task ->
        if (task.hasProperty('duplicatesStrategy')) {
            task.duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
        }
    }
}

blib {
    version = project.blib_version
    recipeViewer = 'rei'

    mod {
        author = 'Stargazer Studios'
        description = 'A module for the AVP universe that adds alien content.'
        credits = 'Stargazer Studios'
        group = 'com.avp.alien'
        icon = 'assets/avp_alien/icon.png'
        id = 'avp_alien'
        license = 'All Rights Reserved'
        name = 'AVP (Alien)'
        version = '0.2.0-alpha.1'

        publish {
            dryRun = true

            discordWebhook {
                username = "MU/TH/UR"
                avatarUrl = "https://i.imgur.com/5Y0EZ9x.jpeg"
                thumbnailUrl = "https://cdn.modrinth.com/data/Uqo0H9FX/8ffabe2f364c34e6b0f13019664c5fe4989c2f95_96.webp"
            }

            curseforge {
                projectId = '1406354'
                projectSlug = 'avp-alien'
            }

            modrinth {
                projectId = '6PQ9G0rJ'
            }
        }
    }

    maven {
        repository 'https://maven.bvanseghi.dev/avp_human'
        repository 'https://maven.bvanseghi.dev/avp_predator'
        repository 'https://maven.bvanseghi.dev/blib_engine'

        publish {
            url = 'https://maven.bvanseghi.dev/avp_alien/'

            credentials {
                usernameEnv = 'AVP_MAVEN_USERNAME'
                passwordEnv = 'AVP_MAVEN_PASSWORD'
            }
        }
    }
}
subprojects {
    plugins.withId('maven-publish') {
        publishing {
            repositories {
                maven {
                    name = 'blib_engine'
                    url = uri('https://maven.aliensvspredatormod.com/releases')

                    credentials {
                        username = System.getenv('MAVEN_USERNAME') ?: 'unused'
                        password = System.getenv('MAVEN_PASSWORD') ?: 'unused'
                    }
                }
            }
        }
    }
}
