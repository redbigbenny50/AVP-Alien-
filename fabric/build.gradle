plugins {
    id 'multiloader-loader'
    id 'fabric-loom' version "${fabric_loom_version}"
    id 'me.modmuss50.mod-publish-plugin' version "${modmuss50_mod_publish_version}"
    id 'com.diffplug.spotless'
}

fabricApi {
    configureDataGeneration({
        modId = project.mod_id
    })
}

tasks.named('runDatagen') {
    doLast {
        def generatedDir = new File(project.projectDir, 'src/main/generated')
        def targetDir = new File(rootProject.projectDir, 'common/src/main/generated')

        println "Checking generatedDir: ${generatedDir.absolutePath}"

        if (generatedDir.exists()) {
            targetDir.mkdirs()

            // Copy files to the common module.
            ant.copy(todir: targetDir) {
                fileset(dir: generatedDir)
            }

            println "Copied generated data to: ${targetDir}"

            // Delete the original generated directory.
            if (generatedDir.deleteDir()) {
                println "Deleted original generated directory: ${generatedDir}"
            } else {
                println "Failed to delete: ${generatedDir} — possibly contains files still in use"
            }
        } else {
            println "No generated data found at: ${generatedDir}"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modApi "com.terraformersmc:modmenu:${modmenu_version}"
    modApi "dev.architectury:architectury-fabric:${project.architectury_version}"
    modApi "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}"
    implementation("com.blib:blib-fabric-${minecraft_version}:${project.blib_version}")
    // Compatibility
    modApi("com.avp.human:avp_human-fabric-${minecraft_version}:${project.avp_human_version}") {
        exclude group: 'com.blib'
    }
    modApi("com.avp.predator:avp_predator-fabric-${minecraft_version}:${project.avp_predator_version}") {
        exclude group: 'com.blib'
    }
    modApi("com.blib.engine:blib_engine-fabric-${minecraft_version}:${project.blib_engine_version}") {
        exclude group: 'com.blib'
    }
    // Required for gigeresque.
    modImplementation "maven.modrinth:gigeresque:${project.gigeresque_modrinth_version}"
    modApi "dev.architectury:architectury-fabric:${project.architectury_version}"
    modImplementation "mod.azure.azurelib:azurelib-fabric-${minecraft_version}:${azurelib_version}"

    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
}

loom {
    def aw = project(":common").file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}

def keyPropsFile = new File(rootProject.projectDir, "key.properties")
if (keyPropsFile.exists()) {
    publishMods {
        def releaseProp = new Properties()
        releaseProp.load(new FileInputStream(keyPropsFile))
        file = remapJar.archiveFile
        changelog = rootProject.file("CHANGELOG.md").text
        type = STABLE
        modLoaders.add("fabric")

        curseforge {
            projectId = project.curseforgeID
            projectSlug = project.projectSlug
            accessToken = releaseProp.getProperty("curseKey")
            minecraftVersions.add("${minecraft_version}")
            requires {
                slug = "fabric-api"
            }
            requires {
                slug = "blib-resurrection"
            }
            client = true
            server = true
        }
        modrinth {
            projectId = project.modrinthID
            accessToken = releaseProp.getProperty('modrinthKey')
            minecraftVersions.add("${minecraft_version}")
            requires {
                slug = "fabric-api"
            }
            requires {
                slug = "blib-resurrection"
            }
            environment = CLIENT_AND_SERVER
        }
    }
}
